pce_addr: pce.lab.local:8443
# Path to the credentials file ("api_<key_id> <secret>", space separated).
# FlowLink opens this path itself; do NOT put the literal key here.
api_key: /opt/flowlink/api_info
data_directory: /opt/flowlink/data
aggregation_minutes: 10
consumers:
  - name: Forcepoint_CEF_log
    parser:
      type: text
      properties:
        src_ip: src
        dst_ip: dst
        dst_port: dpt
        protocol: tcp
        timestamp: start
        timestamp_format: unix
    connectors:
      - type: udp
        properties:
          ports: '5514'
