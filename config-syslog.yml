pce_addr: pce.lab.local:8443
# Replace REPLACE_ME with the contents of /opt/flowlink/api_info before deploy.
api_key: REPLACE_ME
data_directory: /opt/flowlink/data
aggregation_minutes: 10
consumers:
  - name: Forcepoint_CEF_log
    parser:
      type: text
      properties:
        src_ip: src
        dst_ip: dst
        dst_port: dpt
        protocol: tcp
        timestamp: start
        timestamp_format: unix
    connectors:
      - type: udp
        properties:
          ports: '5514'
