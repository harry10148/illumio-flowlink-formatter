[relay]
listen_ip = 0.0.0.0
listen_port = 514
target_ip = 127.0.0.1
target_port = 5514
workers = 4
# Injected as proto=<value>; FlowLink's text parser reads it as the protocol
# (6 = TCP). Leave empty to disable injection.
protocol_value = 6

[healthcheck]
# FlowLink 2.0.0+ runs as a Linux service; the healthcheck only reports on it.
flowlink_service = illumio-flowlink
relay_service = syslog-formatter
